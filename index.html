<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#2f2118">
  <title>Wat Chalo AR Photo</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main id="app">
    <canvas id="outputCanvas" aria-label="Live Wat Chalo AR camera preview"></canvas>

    <section id="startScreen" class="screen">
      <div class="card">
        <div class="eyebrow">BANG KRUA I EXPLORER</div>
        <h1>Wat Chalo AR Photo</h1>
        <p>
          Open the front camera and appear in front of Wat Chalo.
          Processing happens on this device.
        </p>
        <button id="startButton" class="primary">Start AR Camera</button>
        <p id="loadingMessage" class="small">The first opening may take a few seconds while the AI model loads.</p>
      </div>
    </section>

    <div id="topBar" class="topbar hidden">
      <div>
        <strong>Wat Chalo</strong>
        <span id="statusText">Finding you…</span>
      </div>
      <button id="switchCameraButton" class="icon-button" aria-label="Switch camera">↻</button>
    </div>

    <div id="controls" class="controls hidden">
      <button id="captureButton" class="shutter" aria-label="Take photo"><span></span></button>
    </div>

    <section id="photoModal" class="modal hidden" aria-modal="true" role="dialog">
      <div class="modal-card">
        <img id="photoPreview" alt="Your Wat Chalo AR photograph">
        <div class="modal-actions">
          <button id="saveButton" class="primary">Save Photo</button>
          <button id="retakeButton" class="secondary">Retake</button>
        </div>
      </div>
    </section>

    <video id="cameraVideo" playsinline muted></video>
    <canvas id="personCanvas"></canvas>
    <canvas id="maskCanvas"></canvas>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
